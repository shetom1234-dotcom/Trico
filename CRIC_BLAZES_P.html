<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="version" content="v1.0.6">
  <title>Glossy 3D Box with Flower Shapes</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&display=swap" rel="stylesheet">
  <style>
:root {
    --color4: rgba(255,255,255,0.6);
    --color5: rgba(255,255,255,0);
    --color6: #3b086e;
    --color7: #093373;
    --text-shadow-style: 4px 4px 4px rgba(0,0,0,0.8),8px 8px 6px rgba(0,0,0,0.6),-3px -3px 5px rgba(255,255,255,0.1);
}

body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

video {
    display: flex;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

.left-click,
.right-click {
    position: absolute;
    top: 52%;
    transform: translateY(-50%);
    width: 30px;
    height: 80%;
    border-radius: 5px;
    text-align: center;
    line-height: 100px;
    font-size: 30px;
    color: white;
    font-weight: bold;
    z-index: 1;
    cursor: pointer;
}

.left-click {
    left: 1px;
}

.right-click {
    right: 1px;
}

.box {
    box-sizing: border-box;
    position: absolute;
    top: 120px;
    left: 0;
    width: 100%;
    height: calc(100% - 120px);
    margin: 0;
    background-color: transparent;
    background-image: none;
    background-blend-mode: normal;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 15px;
    border: 2px solid rgba(255,255,255,0.6);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.4),0 4px 10px rgba(0,0,0,0.3);
    transform: scaleX(0);
    opacity: 0;
    transform-origin: center;
    transition: transform 0.5s ease,opacity 0.5s ease;
}

.open {
    transform: scaleX(1);
    opacity: 1;
}

.box:not(.open) {
    pointer-events: none;
}

.header {
    position: absolute;
    top: 0;
    width: 99.6%;
    height: 120px;
    background: green;
    border-radius: 15px;
    color: white;
    display: flex;
    font-family: "Rajdhani",sans-serif;
    justify-content: center;
    align-items: center;
    font-size: 100px;
    font-weight: bold;
    box-shadow: inset 0px -4px 10px rgba(0,0,0,0.7),inset 0px 4px 10px rgba(0,0,0,0.7),0px 8px 20px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.2);
    text-shadow: var(--text-shadow-style);
}

.Name_Box {
    display: inline-flex;
    font-family: "Inter Tight",sans-serif;
    font-stretch: condensed;
    justify-content: center;
    align-items: center;
    text-transform: uppercase;
    font-size: 80px;
    color: white;
    font-weight: 900;
    position: absolute;
    bottom: 20px;
    left: 20px;
    border-radius: 30px;
    width: 44%;
    white-space: nowrap;
    height: 130px;
    background-color: var(--color6);
    z-index: 9;
    border: 4px solid white;
}

.Name_Box2 {
    display: inline-flex;
    font-family: "Inter Tight",sans-serif;
    font-stretch: condensed;
    justify-content: center;
    align-items: center;
    text-transform: uppercase;
    font-size: 80px;
    color: white;
    font-weight: 900;
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 44%;
    border-radius: 30px;
    height: 130px;
    background-color: var(--color7);
    z-index: 9;
    white-space: nowrap;
    border: 4px solid white;
}

.result-circle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100px;
    height: 100px;
    margin: 13px;
    border-radius: 50%;
    border: 5px solid #0f99c6;
    font-family: "Rajdhani";
    font-size: 60px;
    font-weight: 900;
    color: white;
    text-align: center;
}

.result-circle.win {
    background-color: green;
    border-color: green;
}

.result-circle.lose {
    background-color: red;
    border-color: red;
}

.result-circle.draw {
    background-color: white;
    color: #333;
    border-color: #ddd;
}

.circular_flag {
    display: none;
    position: absolute;
    top: 35%;
    transform: translateY(-50%);
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border: 5px solid white;
    z-index: 10;
}

.team-flag-left {
    left: 12%;
}

.team-flag-right {
    right: 12%;
}

.slide-1-container {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    height: 100%;
    width: 100%;
    padding: 5px;
}

.slide-box,
.slide-box4 {
    width: 103.5%;
    max-height: 160px;
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    font-family: "Montserrat",sans-serif;
    font-weight: bold;
    border-radius: 10px;
    background-color: #07a010;
    background-clip: border-box;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 6px rgba(0,0,0,0.9),0 0 10px rgba(0,0,0,0.6),0 0 20px rgba(0,0,0,0.3);
}

.slide-box4 {
    margin: 5px 0;
    width: 97%;
    border-radius: 5px;
    background: linear-gradient(135deg,#1123db,#db1145);
    max-height: 200px;
    opacity: 0;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.3),inset 0 0 40px rgba(0,0,0,0.3),0 0 80px rgba(0,0,0,0.8);
}

.slide-box4::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle,var(--color4),var(--color5) 70%);
    transform: rotate(-45deg);
    animation: shine 8s linear infinite;
    z-index: 1;
    pointer-events: none;
}

@keyframes shine {
    0% {
        transform: translateX(-150%) translateY(-150%) rotate(-40deg);
    }
    100% {
        transform: translateX(150%) translateY(150%) rotate(-40deg);
    }
}

@keyframes slideUp {
    from {
        transform: translateY(800px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

#box-2::before {
    animation-delay: 0.2s;
}

#box-3::before {
    animation-delay: 0.4s;
}

#box-4::before {
    animation-delay: 0.6s;
}

#box-5::before {
    animation-delay: 0.8s;
}

#box-6::before {
    animation-delay: 1s;
}

.left_side_slide1,
.left_side_slide2 {
    display: flex;
    width: 50%;
    height: 100%;
    flex-direction: inline-flex;
    justify-content: left;
    align-items: center;
}

.left_side_slide2 {
    justify-content: right;
}

.circle {
    margin: 20px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background-color: #ffffff;
    box-shadow: 0px 4px 8px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
    background-size: 140% 140%;
    background-repeat: no-repeat;
    background-position: center;
}

.text-right_slide6,
.text-left_slide6 {
    color: #ffffff;
    font-weight: bold;
    text-align: left;
    text-shadow: var(--text-shadow-style);
    font-size: 100px;
}

#slide-3 .slide-1-container {
    box-sizing: border-box;
    padding: 6px 14px;
    gap: 4px;
    overflow: hidden;
}

#slide-3 .slide-box,
#slide-3 .slide-box4 {
    width: 100%;
    min-height: 0;
    max-height: none;
    margin: 0;
    flex: 1 1 0;
    border-radius: 8px;
}

.head_to_head-left {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    height: 100%;
    padding: 0 0 0 30px;
    box-sizing: border-box;
    font-family: "Rajdhani", sans-serif;
    font-weight: 700;
    font-size: 60px;
    text-align: left;
}

.head_to_head-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 0 10px;
    box-sizing: border-box;
    font-family: "Rajdhani", sans-serif;
    font-weight: 700;
    font-size: 60px;
    color: orange;
    text-shadow: var(--text-shadow-style);
    text-align: center;
    white-space: nowrap;
}

.head_to_head-right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    padding: 0 30px 0 0;
    box-sizing: border-box;
    font-family: "Rajdhani", sans-serif;
    font-weight: 700;
    font-size: 60px;
    text-align: right;
}

.head-to-head-side-line {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    white-space: nowrap;
    line-height: 1;
}

.head_to_head-right .head-to-head-side-line {
    justify-content: flex-end;
}

.head_to_head-left .head-to-head-side-line {
    justify-content: flex-start;
}

.head-to-head-team-name {
    font-family: "Rajdhani", sans-serif;
    font-size: 56px;
    font-weight: 700;
    color: white;
    line-height: 1;
}

.head-to-head-score {
    font-family: "Rajdhani", sans-serif;
    font-size: 48px;
    font-weight: 700;
    color: white;
    line-height: 1;
}

.center-section {
    font-family: "Roboto",sans-serif;
    font-weight: bold;
    display: flex;
    text-align: center;
    font-size: 140px;
    white-space: nowrap;
    text-shadow: var(--text-shadow-style);
}

.slide5_fullbox {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100%;
    margin-top:-77px;
}

.slide5_upper_box {
    display: flex;
    position: absolute;
    bottom: 0px;
    width: 100%;
    height: 100px;
    background: linear-gradient(135deg,#264928,#bba309);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3),0 8px 15px rgba(0,0,0,0.2);
    justify-content: center;
    align-items: center;
    font-family: "Rajdhani";
    font-weight: 700;
    font-size: 80px;
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: white;
    border: 3px solid #ddd;
}

.slide5_imagebox {
    display: flex;
    margin-top: 50px;
    width: 97%;
    height: 45%;
    justify-content: space-between;
}

.slide5_namebox {
    width: 95%;
    margin-top: 30px;
    margin-left: 100px;
    display: flex;
    font-family: "Rajdhani";
    font-weight: bold;
    color: gold;
    font-size: 100px;
    justify-content: space-between;
    text-shadow: var(--text-shadow-style);
}

.slide5_name2 {
    margin-left: 170px;
    text-shadow: var(--text-shadow-style);
    color: red;
}

.slide5_name3 {
    margin-right: 60px;
}

.weather-data {
    display: flex;
    justify-content: center;
    color: white;
    font-size: 110px;
    font-weight: bold;
}

.slide6_fullbox {
    display: flex;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: flex-start;
    padding-left: 50px;
    border-radius: 20px;
    box-shadow: 10px 10px 20px rgba(0,0,0,0.2);
    font-family: "Rajdhani", sans-serif;
    font-weight: 700;
}

.rectangle {
    width: 35%;
    height: 90%;
    background: linear-gradient(145deg,rgba(255,165,0,0.8),rgba(75,0,130,0.8));
    border-radius: 30px;
    border: 4px solid white;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.3),-5px 7px 15px rgba(0,0,0,0.7);
}

.slide-6-circle {
    display: flex;
    margin-top: 50px;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    align-items: center;
    border: 4px solid white;
    justify-content: center;
}

.left,
.right {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
}

.left {
    left: 0;
}

.right {
    right: 0;
}

.inner-circle {
    display: flex;
    position: absolute;
    justify-content: center;
    text-align: center;
    font-family: "Rajdhani", sans-serif;
    font-size: 60px;
    font-weight: 700;
    -webkit-text-stroke: 1px rgba(0,0,0,0.55);
    paint-order: stroke fill;
    align-items: center;
    color: gold;
    text-shadow: 6px 6px 5px rgba(0,0,0,0.7),4px 4px 10px rgba(0,0,0,0.5),2px 2px 15px rgba(0,0,0,0.3);
    width: 83%;
    height: 83%;
    background-color: grey;
    border-radius: 50%;
    border: 5px solid white;
    z-index: 2;
}

.slide6-box {
    display: flex;
    font-family: "Rajdhani", sans-serif;
    font-size: 60px;
    font-weight: 700;
    -webkit-text-stroke: 1px rgba(0,0,0,0.55);
    paint-order: stroke fill;
    text-align: center;
    align-items: center;
    justify-content: center;
    width: 92%;
    height: 80px;
    margin-top: 30px;
    background: linear-gradient(145deg,#d27cdf,#6aecea);
    border-radius: 10px;
    border: 3px solid black;
    box-shadow: 5px 5px 15px rgba(255,255,255,0.3),-5px -10px 15px rgba(0,0,0,0.7);
}

.right-boxes {
    width: 59%;
    margin-left: 60px;
    height: 88%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 18px;
}

.right-box,
.right-box2 {
    display: flex;
    width: 96%;
    height: 106px;
    background: linear-gradient(135deg,#db1145,#db1145);
    border-radius: 100px;
    color: white;
    font-family: "Rajdhani", sans-serif;
    font-size: 50px;
    font-weight: 700;
    -webkit-text-stroke: 1px rgba(0,0,0,0.55);
    paint-order: stroke fill;
    text-shadow: 6px 6px 5px rgba(0,0,0,0.7),4px 4px 10px rgba(0,0,0,0.5),2px 2px 15px rgba(0,0,0,0.3);
    align-items: center;
    padding-left: 25px;
    padding-right: 25px;
    justify-content: space-between;
    border-width: 0 0 7px 0;
    border-style: solid;
    border-color: white;
    opacity: 0;
    animation: slideUp 2s ease-in-out forwards;
    box-shadow: 3px 4px 15px rgba(0,0,0,0.4),-5px 7px 20px rgba(0,0,0,0.7);
    position: relative;
    overflow: hidden;
}

.right-box::before,
.right-box2::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: rgba(255,255,255,0.3);
    animation: shine 5s infinite linear;
    border-radius: 50%;
}

.right-box2 {
    background: linear-gradient(35deg,#1123db,#1123db);
}

.right-box1 {
    display: flex;
    justify-content: space-between;
    flex-direction: row;
    font-family: "Rajdhani", sans-serif;
    font-size: 50px;
    font-weight: 700;
    width: 100%;
    height: 150px;
    border-radius: 10px;
    margin-bottom: 14px;
}

.right-box1-2 {
    display: flex;
    width: 48%;
    height: 75%;
    text-align: center;
    justify-content: center;
    align-items: center;
    border: 3px solid white;
    background: linear-gradient(180deg,#123d88,#08265e);
    border-radius: 20px;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.4),-5px 7px 20px rgba(0,0,0,0.8);
    font-family: "Rajdhani", sans-serif;
    font-weight: 700;
    color: white;
    -webkit-text-stroke: 1px rgba(0,0,0,0.45);
    paint-order: stroke fill;
}

.slide7_fullbox {
    display: flex;
    width: 100%;
    height: 100%;
    align-items: center;
    border-radius: 20px;
}

.slide7_Image_Box {
    display: flex;
    margin-top: -550px;
    position: relative;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.pitch_video {
    position: absolute;
    top: 36%;
    display: block;
    width: 100%;
    height: 100%;
    z-index: 2;
}

.probability-box {
    display: flex;
    top: 0;
    left: 0;
    width: 100%;
    height: 250px;
    margin-right: auto;
    z-index: 3;
    background-color: rgba(114,0,203,0.1);
    border-radius: 5px;
    justify-content: space-between;
    align-items: center;
    font-family: "Rajdhani",sans-serif;
    position: absolute;
    overflow: hidden;
    box-shadow: 0 0 6px rgba(255,255,255,0.9),0 0 10px rgba(255,255,255,0.6),0 0 20px rgba(255,255,255,0.3);
}

.team {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.team-namee {
    font-weight: bold;
    margin-top: 3px;
    font-size: 80px;
    color: white;
    text-shadow: var(--text-shadow-style);
}

.team1-probability {
    font-weight: bold;
    color: gold;
    font-size: 100px;
    margin-left: 30px;
    margin-top: -5px;
    padding-right: 5px;
    text-shadow: var(--text-shadow-style);
}

.team2-probability {
    font-weight: bold;
    color: gold;
    font-size: 100px;
    margin-right: 30px;
    margin-top: -5px;
    padding-left: 10px;
    text-shadow: var(--text-shadow-style);
}

.divider {
    margin-top: 100px;
    width: 60%;
    height: 30px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 50px;
}

.winning-prob-text {
    font-size: 60px;
    margin-top: -100px;
    color: cyan;
    font-weight: bold;
}

.slide7_bottom_Box {
    display: flex;
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 280px;
    background: linear-gradient(135deg,#51c218,#302b63,#c83621);
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.slide8_fullbox {
    display: flex;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    box-sizing: border-box;
    padding: 55px 80px;
    font-family: "Rajdhani", sans-serif;
}

.umpire-row {
    width: 92%;
    height: 190px;
    display: grid;
    grid-template-columns: 34% 66%;
    align-items: center;
    box-sizing: border-box;
    padding: 0 45px;
    border: 3px solid rgba(255,255,255,0.85);
    border-radius: 28px;
    background: linear-gradient(135deg,rgba(12,36,72,0.96),rgba(4,16,40,0.98));
    box-shadow: inset 0 4px 12px rgba(255,255,255,0.12),
                inset 0 -8px 18px rgba(0,0,0,0.35),
                0 12px 22px rgba(0,0,0,0.42);
    overflow: hidden;
}

.umpire-row:nth-child(2) {
    background: linear-gradient(135deg,rgba(76,24,112,0.96),rgba(35,9,65,0.98));
}

.umpire-row:nth-child(3) {
    background: linear-gradient(135deg,rgba(12,92,74,0.96),rgba(4,45,39,0.98));
}

.umpire-label {
    font-family: "Rajdhani", sans-serif;
    font-size: 74px;
    font-weight: 700;
    color: white;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 3px 4px 5px rgba(0,0,0,0.7);
}

.umpire-value {
    min-width: 0;
    font-family: "Rajdhani", sans-serif;
    font-size: 78px;
    font-weight: 700;
    color: #ffd83d;
    text-transform: uppercase;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 3px 4px 5px rgba(0,0,0,0.7);
}

#slide-1.team-form-mode .Name_Box,
#slide-1.team-form-mode .Name_Box2 {
    bottom: 155px;
}

.team-form-results {
    position: absolute;
    bottom: 20px;
    width: 44%;
    height: 115px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-sizing: border-box;
    z-index: 12;
    border: 4px solid white;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: inset 0 0 18px rgba(0,0,0,0.55),0 8px 18px rgba(0,0,0,0.45);
}

.team-form-results-left {
    left: 20px;
    background-color: var(--color6);
}

.team-form-results-right {
    right: 20px;
    background-color: var(--color7);

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
let liveData = null;
let matchData = null;
let firstPreviewSlideOpened = false;

// ------------------------------------------------------------------
// CRICSPECTER LOCAL SOCKET.IO CONNECTION
// Same flow as the current CricSpecter backend:
// connect -> authenticate -> join scoreboard room -> receive update_new.
// Authentication is sent again after EVERY reconnect, so this preview also
// recovers if the CricSpecter EXE/server itself is restarted.
// ------------------------------------------------------------------
const CRICSPECTER_SOCKET_URL = "http://127.0.0.1:2000";

const CRICSPECTER_HTML_AUTH_KEYS = [
    "7313-665D-8F23-7705",
    "D271-846E-5BF4-C3C5",
    "17F8-5B18-CCD3-452E",
    "5765-C6C0-1DD4-AAE7"
];

function applyCricSpecterPayload(data) {
    if (!data || typeof data !== "object") return;

    // Keep this preview's existing data mapping exactly as it was.
    liveData = data;
    matchData = (
        data.match_info &&
        typeof data.match_info === "object" &&
        !Array.isArray(data.match_info)
    ) ? data.match_info : {};

    if (!firstPreviewSlideOpened) {
        firstPreviewSlideOpened = true;

        Promise.resolve().then(async () => {
            const firstSelectedSlide = usableSlideList()[0] || 1;
            if (!firstSelectedSlide) return;

            currentSlideIndex = firstSelectedSlide;
            click_index = 1;
            await updateSlide(firstSelectedSlide);

            // Tell a parent scoreboard/iframe that the preview has rendered.
            setTimeout(() => {
                window.matchPreviewDataReady = true;
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { type: "cricket-glow-preview-ready" },
                        "*"
                    );
                }
            }, 700);
        });
    }
}

const cricSpecterSocket = io(CRICSPECTER_SOCKET_URL, {
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 500,
    reconnectionDelayMax: 3000,
    timeout: 10000,
    transports: ["websocket", "polling"]
});

// IMPORTANT: authenticate on every connection, including every reconnect.
// This covers normal Socket.IO reconnects and a complete CricSpecter restart.
cricSpecterSocket.on("connect", () => {
    cricSpecterSocket.emit("authenticate", {
        keys: CRICSPECTER_HTML_AUTH_KEYS
    });
});

// CricSpecter broadcasts the complete preview/scoreboard payload on update_new.
cricSpecterSocket.on("update_new", applyCricSpecterPayload);

// Socket.IO itself keeps retrying forever. No UI error is shown in the graphic.

const rightClickButton = document.getElementById('right-click');
const leftClickButton = document.getElementById('left-click');
const headerEl = document.getElementById('header_text');

let currentSlideIndex = 1; // Logical preview slides are numbered 1 through 11.

// SLIDES is the single source of truth for the preview area:
// =========================================================
// PREVIEW SLIDES
// Change ONLY the "background" value below if you want to
// manually use a different image for any individual slide.
// =========================================================
const SLIDES = [
    {
        n: 1,
        div: 'slide-1',
        background: 'static/Backgrounds/1.jpg',
        name: 'Match Status'
    },
    {
        n: 2,
        div: 'slide-1',
        background: 'static/Backgrounds/2.png',
        name: 'Team Form'
    },
    {
        n: 3,
        div: 'slide-1',
        background: 'static/Backgrounds/3.png',
        name: 'Winning Percentage'
    },
    {
        n: 4,
        div: 'slide-2',
        background: 'static/Backgrounds/4.png',
        name: 'Team Comparison - Overall'
    },
    {
        n: 6,
        div: 'slide-3',
        background: 'static/Backgrounds/6.png',
        name: 'Points Table'
    },
    {
        n: 7,
        div: 'slide-4',
        background: 'static/Backgrounds/7.png',
        name: 'Head To Head'
    },
    {
        n: 8,
        div: 'slide-5',
        background: 'static/Backgrounds/8.png',
        name: 'Weather Report'
    },
    {
        n: 9,
        div: 'slide-6',
        background: 'static/Backgrounds/9.png',
        name: 'Venue Stats'
    },
    {
        n: 10,
        div: 'slide-7',
        background: 'static/Backgrounds/10.png',
        name: 'Pitch Report'
    },
    {
        n: 11,
        div: 'slide-8',
        background: 'static/Backgrounds/11.png',
        name: 'Match Umpires'
    }
];

// Find a slide definition by its slide number.
function slideById(number) {
    return SLIDES.find(slide => slide.n === number);
}

let previousSlideDiv = 'slide-1'; // the box div that is currently visible

const PREVIEW_SELECTION_KEY = 'cricketGlow.t20PreviewSelection.v3';
let enabledPreviewSlides = new Set(SLIDES.map(slide => slide.n));
try {
    const saved = JSON.parse(localStorage.getItem(PREVIEW_SELECTION_KEY) || 'null');
    if (Array.isArray(saved)) {
        enabledPreviewSlides = new Set(saved.filter(index => SLIDES.some(slide => slide.n === index)));
    }
} catch (error) {
    console.warn('Preview selection could not be restored.', error);
}
function savePreviewSelection() {
    const selected = Array.from(enabledPreviewSlides).sort((a, b) => a - b);
    localStorage.setItem(PREVIEW_SELECTION_KEY, JSON.stringify(selected));
}

function enabledSlideList() {
    return Array.from(enabledPreviewSlides).sort((a, b) => a - b);
}

function hasArray(value) {
    return Array.isArray(value) && value.length > 0;
}

function hasObject(value) {
    return value !== null &&
        typeof value === 'object' &&
        !Array.isArray(value) &&
        Object.keys(value).length > 0;
}
function getTeamFormResults(team){
    if(hasArray(team?.match_results))return team.match_results;
    const form=matchData?.team_form||liveData?.team_form||{};
    const candidates=[team?.short_name,team?.team_name,team?.full_name]
      .filter(Boolean)
      .map(name=>String(name).trim());
    const directKey=candidates.find(name=>hasArray(form[name]));
    if(directKey)return form[directKey];
    const formKey=Object.keys(form).find(key=>candidates.some(name=>key.toLowerCase()===name.toLowerCase()));
    return formKey&&hasArray(form[formKey])?form[formKey]:[];
}

function slideHasJSONData(index) {
    if (!liveData || !matchData) return false;

    const info = matchData;
    switch (index) {
        case 1:
            return hasArray(liveData.static_data);
        case 2:
            return hasArray(liveData.static_data) &&
                liveData.static_data.slice(0, 2).every(team => hasArray(getTeamFormResults(team)));
        case 3:
            return hasObject(liveData.winning_probability) &&
                hasObject(liveData.winning_probability.team1) &&
                hasObject(liveData.winning_probability.team2);
        case 4:
            return hasArray(info.team_comparison_overall);
        case 6:
            return hasObject(info.Points_Table) &&
                hasArray(info.Points_Table.headers) &&
                hasArray(info.Points_Table.data);
        case 7:
            return hasArray(info.Head_To_Head);
        case 8:
            return hasObject(info.weather_report);
        case 9:
            return hasObject(info.vanue_stats);
        case 10:
            return hasObject(info.pace_vs_spin) &&
                (hasObject(info.pace_vs_spin.pace) || info.pace_vs_spin.pace_wkt !== undefined);
        case 11:
            return hasObject(info.Match_Umpire);
        default:
            return false;
    }
}
function usableSlideList() {
    return enabledSlideList().filter(slideHasJSONData);
}
function buildPreviewSelectorPanel() {
  const options = document.getElementById('preview-selector-options');
  options.innerHTML = '';
  SLIDES.forEach((slide, position) => {
    const label = document.createElement('label');
    label.className = 'preview-selector-option';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = enabledPreviewSlides.has(slide.n);
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) enabledPreviewSlides.add(slide.n);
      else enabledPreviewSlides.delete(slide.n);
      savePreviewSelection();
    });
    label.append(checkbox, document.createTextNode((position + 1) + '. ' + slide.name));
    options.appendChild(label);
  });
}
document.getElementById('preview-select-all').addEventListener('click', () => {
  enabledPreviewSlides = new Set(SLIDES.map(slide => slide.n));
  savePreviewSelection();
  buildPreviewSelectorPanel();
});
document.getElementById('preview-clear-all').addEventListener('click', () => {
  enabledPreviewSlides.clear();
  savePreviewSelection();
  buildPreviewSelectorPanel();
});
buildPreviewSelectorPanel();

document.addEventListener('keydown',event=>{
  if(event.repeat||event.ctrlKey||event.altKey||event.metaKey)return;
  const target=event.target;
  if(target&&/INPUT|TEXTAREA|SELECT/.test(target.tagName))return;
  const key=event.key?.toLowerCase();
  if(key==='p')document.getElementById('preview-selector-panel').classList.toggle('open');
});

// Renders the content for the given slide number.
function handleSlide(index) {
    if (!liveData || !matchData || !slideHasJSONData(index)) return 0;

    switch (index) {
        case 1:
            renderIntroSlide('match-status', liveData.static_data);
            break;
        case 2:
            renderIntroSlide('team-form', liveData.static_data);
            break;
        case 3:
            renderIntroSlide('winning-percentage', liveData.static_data, liveData.winning_probability);
            break;
        case 4:
            renderTeamComparison(
                matchData.team_comparison_overall,
                liveData.static_data,
                'Team Comparison (OVERALL)'
            );
            break;
        case 6:
            renderPointsTable(matchData.Points_Table);
            break;
        case 7:
            renderHeadToHead(matchData.Head_To_Head);
            break;
        case 8:
            renderWeather(matchData.weather_report);
            break;
        case 9:
            renderVenueStats(matchData.vanue_stats);
            break;
        case 10:
            renderPitchReport(matchData.pace_vs_spin);
            break;
        case 11:
            renderUmpires(matchData.Match_Umpire);
            break;
        default:
            return 0;
    }

    return 1;
}

function setSlideBackground(index) {
    const slide = slideById(index);
    if (!slide) return;

    const slideBox = document.getElementById(slide.div);
    if (!slideBox) return;

    // Only the currently selected logical slide gets its own background.
    slideBox.style.backgroundImage = `url("${slide.background}")`;
    slideBox.style.backgroundSize = 'cover';
    slideBox.style.backgroundPosition = 'center';
    slideBox.style.backgroundRepeat = 'no-repeat';
}

function removePreviewSlideClasses(element) {
    if (!element) return;

    [...element.classList].forEach(className => {
        if (
            className.startsWith('logical-slide-') ||
            className.startsWith('preview-slide-') ||
            className.startsWith('preview-header-slide-')
        ) {
            element.classList.remove(className);
        }
    });
}

function applyLogicalSlideClasses(index) {
    const slide = slideById(index);
    if (!slide) return;

    // Remove old logical-slide classes from every physical slide box.
    document.querySelectorAll('.box').forEach(box => {
        [...box.classList].forEach(className => {
            if (className.startsWith('logical-slide-')) {
                box.classList.remove(className);
            }
        });
    });

    // Header also gets its own per-logical-slide class.
    [...headerEl.classList].forEach(className => {
        if (className.startsWith('preview-header-slide-')) {
            headerEl.classList.remove(className);
        }
    });
    headerEl.classList.add(`preview-header-slide-${index}`);

    const slideBox = document.getElementById(slide.div);
    if (!slideBox) return;
    slideBox.classList.add(`logical-slide-${index}`);

    // Shared intro slide elements: logical slides 1, 2, 3.
    if (index >= 1 && index <= 3) {
        const leftFlag = document.getElementById('circular_flag1');
        const rightFlag = document.getElementById('circular_flag2');
        const leftBox = document.getElementById('team1');
        const rightBox = document.getElementById('team2');

        [leftFlag, rightFlag, leftBox, rightBox].forEach(removePreviewSlideClasses);

        leftFlag?.classList.add(`preview-slide-${index}-left-flag`);
        rightFlag?.classList.add(`preview-slide-${index}-right-flag`);
        leftBox?.classList.add(`preview-slide-${index}-left-box`);
        rightBox?.classList.add(`preview-slide-${index}-right-box`);
    }

    // Team Comparison Overall uses logical slide 4.
    if (index === 4) {
        const container = document.getElementById('comparison-container');
        const teamHeader = document.getElementById('comparison-team-header');
        const leftTeamBox = document.getElementById('comparison-team-left');
        const rightTeamBox = document.getElementById('comparison-team-right');
        const leftFlag = document.getElementById('team_compare_flag1');
        const rightFlag = document.getElementById('team_compare_flag2');
        const leftName = document.getElementById('team_compare_team1');
        const rightName = document.getElementById('team_compare_team2');

        [
            container,
            teamHeader,
            leftTeamBox,
            rightTeamBox,
            leftFlag,
            rightFlag,
            leftName,
            rightName
        ].forEach(removePreviewSlideClasses);

        container?.classList.add(`preview-slide-${index}-container`);
        teamHeader?.classList.add(`preview-slide-${index}-team-header`);
        leftTeamBox?.classList.add(`preview-slide-${index}-left-team-box`);
        rightTeamBox?.classList.add(`preview-slide-${index}-right-team-box`);
        leftFlag?.classList.add(`preview-slide-${index}-left-flag`);
        rightFlag?.classList.add(`preview-slide-${index}-right-flag`);
        leftName?.classList.add(`preview-slide-${index}-left-team-name`);
        rightName?.classList.add(`preview-slide-${index}-right-team-name`);
    }
}

// Switch the preview area to the given slide number.
async function updateSlide(newIndex) {
    const slide = slideById(newIndex);
    if (!slide || !enabledPreviewSlides.has(newIndex)) return;
    setSlideBackground(newIndex);
    applyLogicalSlideClasses(newIndex);

    const slideBox = document.getElementById(slide.div);
    const previousBox = document.getElementById(previousSlideDiv);

    // Only one slide box is visible at a time.
    document.querySelectorAll('.box').forEach(box=>{
        if (box !== slideBox) {
            box.classList.remove('open');
            box.style.display = 'none';
        }
    });
    headerEl.style.display = 'flex';
    previousBox.classList.remove('open');

    setTimeout(() => {
        if (previousSlideDiv !== slide.div) {
            previousBox.style.display = 'none';
            slideBox.style.display = 'flex';
            previousSlideDiv = slide.div;
            setTimeout(() => slideBox.classList.add('open'), 100);
        } else {
            slideBox.classList.add('open'); // Slide is already visible: just open it
        }

        // If the slide could not be rendered, jump to the nearest available slide.
        if (handleSlide(newIndex) === 0) {
            if (click_index === 1) {
                const nextAvailable = usableSlideList().find(index => index > currentSlideIndex);
                if (nextAvailable) currentSlideIndex = nextAvailable;
            } else if (click_index === 0) {
                const previousAvailable = usableSlideList().filter(index => index < currentSlideIndex);
                if (previousAvailable.length) currentSlideIndex = previousAvailable[previousAvailable.length - 1];
            }
            if (currentSlideIndex !== newIndex) updateSlide(currentSlideIndex);
        }
    }, 500); // Wait for the slide animation before rendering content
}

let click_index = '';
let isClickable = true; // Flag to prevent rapid clicks

function nextSlide() {
    if (!isClickable) return;
    const nextIndex=usableSlideList().find(index=>index>currentSlideIndex);
    if(!nextIndex)return;
    isClickable = false; // Disable further clicks
    currentSlideIndex=nextIndex;
    updateSlide(currentSlideIndex);
    click_index = 1;

    setTimeout(() => {
        isClickable = true; // Enable click after 1 sec
    }, 1000);
}

function prevSlide() {
    if (!isClickable) return; // Stop if button is disabled
    const previousIndexes=usableSlideList().filter(index=>index<currentSlideIndex);
    const previousIndex=previousIndexes.length?previousIndexes[previousIndexes.length-1]:null;
    if (previousIndex) {
        isClickable = false; // Disable further clicks
        currentSlideIndex=previousIndex;
        updateSlide(currentSlideIndex);
        click_index = 0;

        setTimeout(() => {
            isClickable = true; // Enable click after 1 sec
        }, 1000);
    }

}

// Handle right click (next slide)
rightClickButton.addEventListener('click', function () {
  nextSlide();
});

// Handle left click (previous slide)
leftClickButton.addEventListener('click', function () {
  prevSlide();
});

// Keyboard navigation visits only selected slides that contain usable JSON.
document.addEventListener('keydown', function (event) {
    const target=event.target;
    if(target&&/INPUT|TEXTAREA|SELECT|BUTTON/.test(target.tagName))return;
    if(event.ctrlKey||event.altKey||event.metaKey)return;

    if(event.key==='ArrowRight'||event.key==='ArrowDown'||event.key==='PageDown'||event.key===' '){
        event.preventDefault();
        nextSlide();
    }else if(event.key==='ArrowLeft'||event.key==='ArrowUp'||event.key==='PageUp'){
        event.preventDefault();
        prevSlide();
    }else if(event.key==='Home'){
        const first=usableSlideList()[0];
        if(first){event.preventDefault();currentSlideIndex=first;click_index=1;updateSlide(first);}
    }else if(event.key==='End'){
        const slides=usableSlideList();
        const last=slides[slides.length-1];
        if(last){event.preventDefault();currentSlideIndex=last;click_index=0;updateSlide(last);}
    }
});

function renderTeamComparison(
    teamComparisonData,
    staticData,
    header
) {
    if (!hasArray(teamComparisonData) || !hasArray(staticData) || staticData.length < 2) {
        return false;
    }

    const slideIndex = 4;

    headerEl.innerHTML = header;

    const team1Data = staticData[0];
    const team2Data = staticData[1];

    const team1Flag = document.getElementById('team_compare_flag1');
    const team2Flag = document.getElementById('team_compare_flag2');
    const team1Name = document.getElementById('team_compare_team1');
    const team2Name = document.getElementById('team_compare_team2');

    team1Name.textContent = getShortName(team1Data.team_name);
    team2Name.textContent = getShortName(team2Data.team_name);

    setFlagImage(team1Data.team_name, team1Flag, team1Data.flag);
    setFlagImage(team2Data.team_name, team2Flag, team2Data.flag);

    for (let index = 0; index < 5; index++) {
        const box = document.getElementById(`box-${index + 2}`);
        if (!box) continue;

        box.innerHTML = '';

        // Remove classes generated by the other logical comparison slide.
        [...box.classList].forEach(className => {
            if (className.startsWith('preview-slide-4-')) {
                box.classList.remove(className);
            }
        });

        box.className =
            `comparison-stat-row comparison-row-${index + 1} ` +
            `preview-slide-${slideIndex}-stat-row ` +
            `preview-slide-${slideIndex}-row-${index + 1}`;

        const raw = teamComparisonData[index];

        if (raw === undefined || raw === null || String(raw).trim() === '') {
            box.style.display = 'none';
            continue;
        }

        box.style.display = 'grid';

        const splitData = String(raw).split(' - ');
        const leftValue = splitData[0] ?? '';
        const label = splitData[1] ?? '';
        const rightValue = splitData.slice(2).join(' - ') || '';

        if (String(label).trim().toUpperCase() === 'NRR') {
            box.classList.add(
                'comparison-nrr-row',
                `preview-slide-${slideIndex}-nrr-row`
            );
        }

        const leftSide = document.createElement('div');
        leftSide.className =
            `comparison-stat-left ` +
            `comparison-row-${index + 1}-left ` +
            `preview-slide-${slideIndex}-stat-left ` +
            `preview-slide-${slideIndex}-row-${index + 1}-left`;
        leftSide.textContent = leftValue;

        const middleSide = document.createElement('div');
        middleSide.className =
            `comparison-stat-label ` +
            `comparison-row-${index + 1}-label ` +
            `preview-slide-${slideIndex}-stat-label ` +
            `preview-slide-${slideIndex}-row-${index + 1}-label`;
        middleSide.textContent = label;

        const rightSide = document.createElement('div');
        rightSide.className =
            `comparison-stat-right ` +
            `comparison-row-${index + 1}-right ` +
            `preview-slide-${slideIndex}-stat-right ` +
            `preview-slide-${slideIndex}-row-${index + 1}-right`;
        rightSide.textContent = rightValue;

        box.append(leftSide, middleSide, rightSide);
    }

    return true;
}

function setFlagImage(team_name, imageBox, flagUrl) {
    if(!imageBox)return;
    imageBox.style.display = "flex";
    const localFlag=`COMMON/Flags/${team_name}.gif`;
    imageBox.style.backgroundImage = flagUrl?`url('${flagUrl}')`:'none';
    loadImage(localFlag)
      .then(url=>{imageBox.style.backgroundImage=`url('${encodeImageUrl(url)}')`;})
      .catch(()=>{imageBox.style.backgroundImage=flagUrl?`url('${flagUrl}')`:'none';});
    imageBox.style.backgroundSize = 'cover';
    imageBox.style.backgroundPosition = 'center';
    imageBox.style.backgroundRepeat = 'no-repeat';
}

function getShortName(name) {
    name=String(name||'');
    // Step 1: Replace "Women" with "W"
    let shortName = name.replace("Women", "W");

    if (shortName == "Sunrisers Hyderabad") {
        shortName = "SRH"
    }
    // If longer than 13 characters, show initials
    if (shortName.length > 13) {
        document.getElementById('team1').style.fontSize = "120px";
        document.getElementById('team2').style.fontSize = "120px";
        document.getElementById('team_compare_team1').style.fontSize = "100px";
        document.getElementById('team_compare_team2').style.fontSize = "100px";

        return shortName
            .split(" ") // Split into words
            .map(word => word[0]) // Take the first letter of each word
            .join(""); // Join letters together
    }

    return shortName;
}

// Renders one of the three intro slides into the #slide-1 box.
// mode: 'match-status' | 'team-form' | 'winning-percentage'
function renderIntroSlide(mode, data, wp) {
    if (!Array.isArray(data) || data.length < 2) return false;

    const slide = document.getElementById('slide-1');
    const team1Box = document.getElementById('team1');
    const team2Box = document.getElementById('team2');

    // Clear old intro-slide content before drawing anything new.
    document.querySelectorAll('.team-form-results').forEach(item => item.remove());
    slide.classList.remove('team-form-mode');
    document.getElementById('circular_flag1').style.display = "none";
    document.getElementById('circular_flag2').style.display = "none";
    team1Box.innerHTML = "";
    team2Box.innerHTML = "";

    if (mode === 'match-status') {
        headerEl.innerHTML = "\u2694\ufe0f MATCH STATUS \u2694\ufe0f";
        team1Box.textContent = getShortName(data[0].team_name);
        team2Box.textContent = getShortName(data[1].team_name);
        setFlagImage(data[0].team_name, document.getElementById('circular_flag1'), data[0].flag);
        setFlagImage(data[1].team_name, document.getElementById('circular_flag2'), data[1].flag);
        return;
    }

    if (mode === 'team-form') {
        headerEl.innerHTML = "\uD83C\uDFCF TEAM FORM \uD83C\uDFCF";

        // Same layout as Match Status.
        slide.classList.add('team-form-mode');
        team1Box.textContent = getShortName(data[0].team_name);
        team2Box.textContent = getShortName(data[1].team_name);

        setFlagImage(
            data[0].team_name,
            document.getElementById('circular_flag1'),
            data[0].flag
        );
        setFlagImage(
            data[1].team_name,
            document.getElementById('circular_flag2'),
            data[1].flag
        );

        // Recent form row directly underneath each team-name box.
        const team1Results = document.createElement('div');
        team1Results.className = 'team-form-results team-form-results-left preview-slide-2-left-form-box';

        const team2Results = document.createElement('div');
        team2Results.className = 'team-form-results team-form-results-right preview-slide-2-right-form-box';

        createResultCircles(getTeamFormResults(data[0]), team1Results, 'left', 2);
        createResultCircles(getTeamFormResults(data[1]), team2Results, 'right', 2);

        slide.append(team1Results, team2Results);
        return;
    }

    if (mode === 'winning-percentage') {
        if (!wp?.team1 || !wp?.team2) return false;

        headerEl.innerHTML = "\uD83C\uDFC6 MATCH WINNING PERCENTAGE \uD83C\uDFC6";

        // Show the team flags OUTSIDE the bottom boxes,
        // in the same circular positions used by Slides 1 and 2.
        setFlagImage(
            data[0].team_name,
            document.getElementById('circular_flag1'),
            data[0].flag
        );
        setFlagImage(
            data[1].team_name,
            document.getElementById('circular_flag2'),
            data[1].flag
        );

        const probabilityRows = [wp.team1, wp.team2];

        renderWinningTeam(
            team1Box,
            data[0],
            probabilityFor(data[0], 0, probabilityRows),
            'left',
            3
        );

        renderWinningTeam(
            team2Box,
            data[1],
            probabilityFor(data[1], 1, probabilityRows),
            'right',
            3
        );

        return;
    }
}

// Creates W / L / D circles with slide-specific classes.
function createResultCircles(results, container, side = '', logicalSlideIndex = 0) {
    if (!Array.isArray(results)) results = [];

    results.forEach((result, index) => {
        const circle = document.createElement("div");
        circle.textContent = result;
        circle.classList.add("result-circle");

        if (logicalSlideIndex && side) {
            circle.classList.add(
                `preview-slide-${logicalSlideIndex}-${side}-result`,
                `preview-slide-${logicalSlideIndex}-${side}-result-${index + 1}`
            );
        }

        if (result === "W") {
            circle.classList.add("win");
        } else if (result === "L") {
            circle.classList.add("lose");
        } else if (result === "D") {
            circle.classList.add("draw");
        }

        container.appendChild(circle);
    });
}

// Finds the probability row that matches the team, or uses a fallback row.
function probabilityFor(team, index, probabilityRows) {
    const names = [team.short_name, team.team_name, team.full_name]
        .filter(Boolean)
        .map(name => String(name).trim().toLowerCase());
    return probabilityRows.find(row => row && names.includes(String(row.name || '').trim().toLowerCase())) || probabilityRows[index] || {};
}

// Draws one team's logo and winning percentage text.
function renderWinningTeam(

) {
    container.innerHTML = '';

        `${row.probability ?? 'N/A'}`;

}

const HEAD_TO_HEAD_COLOR = "rgba(63, 43, 150, 1)";

function renderPointsTable(pointsTable) {
    if (
        !pointsTable ||
        !Array.isArray(pointsTable.headers) ||
        !Array.isArray(pointsTable.data)
    ) {
        return false;
    }

    headerEl.innerHTML =
        "\uD83D\uDCC8 " +
        String(pointsTable.title || 'POINTS TABLE').substring(0, 32) +
        " \uD83D\uDCC9";

    const container = document.getElementById("slide-1-container");
    if (!container) return false;

    container.innerHTML = "";
    container.className =
        "slide-1-container preview-slide-6-points-container";

    // --------------------------------------------------------
    // Resolve column indexes from the JSON headers.
    // This keeps the visual fixed even if the backend uses
    // names such as Match/M, Won/W, Points/Pts.
    // --------------------------------------------------------
    const headers = pointsTable.headers.map(value =>
        String(value ?? '').trim()
    );

    const normalize = value =>
        String(value ?? '')
            .trim()
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, '');

    function findHeaderIndex(aliases) {
        const normalizedAliases = aliases.map(normalize);
        return headers.findIndex(header =>
            normalizedAliases.includes(normalize(header))
        );
    }

    const teamHeaderIndex = findHeaderIndex([
        'TEAM',
        'TEAM NAME',
        'TEAMNAME'
    ]);

    const matchHeaderIndex = findHeaderIndex([
        'M',
        'MAT',
        'MATCH',
        'MATCHES',
        'PLAYED',
        'P'
    ]);

    const winHeaderIndex = findHeaderIndex([
        'W',
        'WIN',
        'WINS',
        'WON'
    ]);

    const lossHeaderIndex = findHeaderIndex([
        'L',
        'LOSS',
        'LOSSES',
        'LOST'
    ]);

    const nrrHeaderIndex = findHeaderIndex([
        'NRR',
        'NETRR',
        'NETRUNRATE'
    ]);

    const pointsHeaderIndex = findHeaderIndex([
        'POINT',
        'POINTS',
        'PTS'
    ]);

    // --------------------------------------------------------
    // Header row — exact six visual columns.
    // --------------------------------------------------------
    const tableHeader = document.createElement('div');
    tableHeader.className = 'preview-slide-6-table-header';

    const headerCells = [
        ['TEAM', 'preview-slide-6-header-team'],
        ['M', 'preview-slide-6-header-m'],
        ['W', 'preview-slide-6-header-w'],
        ['L', 'preview-slide-6-header-l'],
        ['NRR', 'preview-slide-6-header-nrr'],
        ['POINTS', 'preview-slide-6-header-points']
    ];

    headerCells.forEach(([text, className]) => {
        const cell = document.createElement('div');
        cell.className =
            `preview-slide-6-header-cell ${className}`;
        cell.textContent = text;
        tableHeader.appendChild(cell);
    });

    container.appendChild(tableHeader);

    const rows = pointsTable.data.filter(Array.isArray);

    // Fit all point-table rows to the real visible preview height.
    const tableHeaderHeight = 64;
    const containerHeight = container.clientHeight || Math.max(0, window.innerHeight - 120);
    const availableHeight = Math.max(0, containerHeight - tableHeaderHeight);
    const rowHeight = rows.length
        ? Math.max(46, Math.floor(availableHeight / rows.length))
        : 76;

    container.style.setProperty(
        '--points-row-height',
        `${rowHeight}px`
    );

    // --------------------------------------------------------
    // Helper: detect common backend row shapes.
    // --------------------------------------------------------
    function parseTeamRow(teamData, rowIndex) {
        const values = [...teamData];

        let rank = rowIndex + 1;
        let flag = '';
        let teamName = '';

        // Common shape A:
        // [rank, flagUrl, teamName, ...stats]
        if (
            values.length >= 3 &&
            !/^https?:/i.test(String(values[0] ?? '')) &&
            /^https?:/i.test(String(values[1] ?? ''))
        ) {
            rank = values[0] || rowIndex + 1;
            flag = values[1] || '';
            teamName = values[2] || '';
        }
        // Common shape B:
        // [flagUrl, teamName, ...stats]
        else if (/^https?:/i.test(String(values[0] ?? ''))) {
            flag = values[0] || '';
            teamName = values[1] || '';
        }
        // Generic shape using headers.
        else {
            const possibleRank = values.find((value, index) =>
                index < 2 && /^\d+$/.test(String(value ?? '').trim())
            );

            if (possibleRank !== undefined) {
                rank = possibleRank;
            }

            const flagIndex = values.findIndex(value =>
                /^https?:/i.test(String(value ?? ''))
            );

            if (flagIndex >= 0) {
                flag = values[flagIndex] || '';
            }

            if (
                teamHeaderIndex >= 0 &&
                values[teamHeaderIndex] !== undefined
            ) {
                teamName = values[teamHeaderIndex] || '';
            } else {
                const candidate = values.find(value => {
                    const text = String(value ?? '').trim();
                    return (
                        text &&
                        !/^https?:/i.test(text) &&
                        !/^[+\-]?\d+(\.\d+)?$/.test(text)
                    );
                });
                teamName = candidate || '';
            }
        }

        // Work out the stat start offset for the two common shapes.
        const commonOffset =
            /^https?:/i.test(String(values[0] ?? ''))
                ? 2
                : (
                    values.length >= 3 &&
                    /^https?:/i.test(String(values[1] ?? ''))
                        ? 3
                        : 0
                );

        const statValues =
            commonOffset > 0 ? values.slice(commonOffset) : values;

        function valueFromHeader(headerIndex, aliases, fallbackIndex) {
            if (
                headerIndex >= 0 &&
                commonOffset === 0 &&
                values[headerIndex] !== undefined
            ) {
                return values[headerIndex];
            }

            // For common row shapes the first two/three identifying
            // fields are already removed, so map by the filtered
            // backend header list.
            const dataHeaders = headers.filter((header, index) => {
                const key = normalize(header);
                if (index === 0 && !key) return false;
                return ![
                    'TEAM',
                    'TEAMNAME',
                    'RANK',
                    'POS',
                    'POSITION',
                    'FLAG',
                    'LOGO',
                    'CUPR'
                ].includes(key);
            });

            const aliasKeys = aliases.map(normalize);
            const filteredIndex = dataHeaders.findIndex(header =>
                aliasKeys.includes(normalize(header))
            );

            if (
                filteredIndex >= 0 &&
                statValues[filteredIndex] !== undefined
            ) {
                return statValues[filteredIndex];
            }

            return statValues[fallbackIndex] ?? '';
        }

        return {
            rank,
            flag,
            teamName,
            matches: valueFromHeader(
                matchHeaderIndex,
                ['M', 'MAT', 'MATCH', 'MATCHES', 'PLAYED', 'P'],
                0
            ),
            wins: valueFromHeader(
                winHeaderIndex,
                ['W', 'WIN', 'WINS', 'WON'],
                1
            ),
            losses: valueFromHeader(
                lossHeaderIndex,
                ['L', 'LOSS', 'LOSSES', 'LOST'],
                2
            ),
            nrr: valueFromHeader(
                nrrHeaderIndex,
                ['NRR', 'NETRR', 'NETRUNRATE'],
                3
            ),
            points: valueFromHeader(
                pointsHeaderIndex,
                ['POINT', 'POINTS', 'PTS'],
                4
            )
        };
    }

    // --------------------------------------------------------
    // Team rows.
    // --------------------------------------------------------
    rows.forEach((teamData, index) => {
        const team = parseTeamRow(teamData, index);

        const row = document.createElement('div');
        const paletteIndex = (index % 8) + 1;

        row.className =
            `preview-slide-6-table-row ` +
            `preview-slide-6-row-${index + 1} ` +
            `preview-slide-6-row-${paletteIndex}`;

        // TEAM cell
        const teamCell = document.createElement('div');
        teamCell.className =
            'preview-slide-6-cell preview-slide-6-team-cell';

        const rank = document.createElement('div');
        rank.className = 'preview-slide-6-rank';
        rank.textContent = team.rank;

        const logo = document.createElement('img');
        logo.className = 'preview-slide-6-team-logo';
        logo.alt = String(team.teamName || 'Team');

        if (team.flag) {
            logo.src = team.flag;
        }

        const teamName = document.createElement('div');
        teamName.className = 'preview-slide-6-team-name';
        teamName.textContent = team.teamName || 'N/A';

        teamCell.append(rank, logo, teamName);

        // Numeric cells
        const matches = document.createElement('div');
        matches.className =
            'preview-slide-6-cell preview-slide-6-matches';
        matches.textContent = team.matches;

        const wins = document.createElement('div');
        wins.className =
            'preview-slide-6-cell preview-slide-6-wins';
        wins.textContent = team.wins;

        const losses = document.createElement('div');
        losses.className =
            'preview-slide-6-cell preview-slide-6-losses';
        losses.textContent = team.losses;

        const nrr = document.createElement('div');
        nrr.className =
            'preview-slide-6-cell preview-slide-6-nrr';
        nrr.textContent = team.nrr;

        const points = document.createElement('div');
        points.className =
            'preview-slide-6-cell preview-slide-6-points';
        points.textContent = team.points;

        row.append(
            teamCell,
            matches,
            wins,
            losses,
            nrr,
            points
        );

        container.appendChild(row);
    });

    return true;
}

function renderHeadToHead(data) {
    if(!hasArray(data))return false;
    const randomColor = HEAD_TO_HEAD_COLOR.replace(/1\)/, '0.5)');
    document.documentElement.style.setProperty('--color4', randomColor);

    headerEl.innerHTML = "\uD83E\uDD1C Head To Head \uD83E\uDD1B";

    const container = document.getElementById("slide-2-container"); // Target the container
    container.innerHTML = "";

    const initialBox = document.createElement('div');
    initialBox.className = 'slide-box';

    initialBox.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="left_side_slide1">
                <div class="circle" style="background-image: url('${data[0].team1_logo}');"></div>
                <span class="text-left_slide6">${data[0].team1_name}</span>
            </div>
            <div class="center-section">
                ${data[0].team1_wins} - ${data[0].team2_wins}
            </div>
            <div class="left_side_slide2">
                <span class="text-right_slide6">${data[0].team2_name}</span>
                <div class="circle" style="background-image: url('${data[0].team2_logo}');"></div>
            </div>
        </div>
    `;

    container.appendChild(initialBox);

    const recentMatches = data.slice(1, 6);

    recentMatches.forEach((match, index) => {
        const box = document.createElement('div');
        box.className = `slide-box4 head-to-head-match-row head-to-head-row-${index + 1}`;

        box.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; height: 100%;">
                <div class="head_to_head-left">
                    <div class="head-to-head-side-line">
                        <span class="head-to-head-team-name">${match.team1_name}</span>
                        <span class="head-to-head-score">${match.team1_runs} <span class="head-to-head-ball-count">(${match.team1_overs})</span></span>
                    </div>
                </div>
                <div class="head_to_head-center">
                    <span>${match.match_result}</span>
                </div>
                <div class="head_to_head-right">
                    <div class="head-to-head-side-line">
                        <span class="head-to-head-team-name">${match.team2_name}</span>
                        <span class="head-to-head-score">${match.team2_runs} <span class="head-to-head-ball-count">(${match.team2_overs})</span></span>
                    </div>
                </div>
            </div>
        `;

        container.appendChild(box);
        setTimeout(() => {
            box.style.animation = "slideUp 0.8s ease-out forwards";
        }, 50);
    });
}

function renderWeather(weatherData) {
    if(!hasObject(weatherData))return false;
    headerEl.innerHTML = "\uD83C\uDF24\ufe0f Weather Report \uD83C\uDF24\ufe0f";

    // Extract integer part using regex or parseInt
    let rainValue = weatherData.Rain ? parseInt(weatherData.Rain) + "%" : "N/A";
    let humidityValue = weatherData.Humidity ? parseInt(weatherData.Humidity) + "%" : "N/A";

    document.getElementById('ground').innerHTML = weatherData.Stadium;

    document.getElementById("rain_value").innerHTML = rainValue;
    document.getElementById("temp_value").innerHTML = weatherData.Temp || "N/A";
    document.getElementById("humidity_value").innerHTML = humidityValue;
}

function setColorPercentage(percentage) {
    let leftDiv = document.getElementById("left");
    let rightDiv = document.getElementById("right");

    leftDiv.style.width = percentage + "%";
    rightDiv.style.width = (100 - percentage) + "%";
    rightDiv.style.left = percentage + "%";
}

function renderVenueStats(data) {
    if(!hasObject(data))return false;

    headerEl.innerHTML = "\uD83D\uDCCD Venue Stats \uD83D\uDCCD";
    // Set data for slide6-box (Win Bat First and Win Bowl First)
    const winBatFirstInt = parseInt(String(data.Win_Bat_First||'0').replace('%', ''));
    setColorPercentage(winBatFirstInt);

    document.getElementById('inner_circle').innerHTML = `Total Matches ${data.Matches_Played}`;

    document.getElementById('slide6_box1').innerHTML = `Win Bat First:&nbsp <span style="color: green;">${data.Win_Bat_First}</span>`;
    document.getElementById('slide6_box2').innerHTML = `Win Bowl First:&nbsp <span style="color: red;">${data.Win_Bowl_First}</span>`;

    // Set data for the right side top boxes (Average 1st and 2nd Inns)
    document.getElementById('slide6_average_1st').innerHTML = `AVG 1ST INNING:&nbsp <span style="color: white;">${data.Average_1st_Inns}</span>`;
    document.getElementById('slide6_average_2nd').innerHTML = `AVG 2ND INNING:&nbsp <span style="color: white;">${data.Average_2nd_Inns}</span>`;

    // Set data for match records
    const matchRecords = data.Match_Records||{};
    const record=name=>matchRecords[name]||{Matchup:'N/A',Score:'N/A'};

    // Set match records with the middle data (Matchup) in black color
    document.getElementById('slide6_match_record_2').innerHTML =
        `Highest Total <span style="color: gold;">${String(record('Highest Total').Matchup).replace("by ", "")}</span><span>${record('Highest Total').Score}</span>`;

    document.getElementById('slide6_match_record_1').innerHTML =
        `Lowest Total <span style="color: gold;">${String(record('Lowest Total').Matchup).replace("by ", "")}</span><span>${record('Lowest Total').Score}</span>`;

    document.getElementById('slide6_match_record_3').innerHTML =
        `Highest Chased <span style="color: gold;">${String(record('Highest Chased').Matchup).replace("by ", "")}</span><span>${record('Highest Chased').Score}</span>`;

    document.getElementById('slide6_match_record_4').innerHTML =
        `Lowest Defended <span style="color: gold;">${String(record('Lowest Defended').Matchup).replace("by ", "")}</span><span>${record('Lowest Defended').Score}</span>`;
}

function renderPitchReport(data) {
    if (data) {
        const pace=data.pace||{};
        const spin=data.spin||{};
        const paceWickets=pace.wickets??data.pace_wkt??'N/A';
        const spinWickets=spin.wickets??data.spin_wkt??'N/A';
        const pacePercentRaw=pace.percent??data.pace_percent;
        const spinPercentRaw=spin.percent??data.spin_percent;
        const paceLabel=String(pacePercentRaw??'N/A').replace(/%?$/,'%');
        headerEl.innerHTML = "\uD83D\uDEE3\ufe0f Pitch Report \uD83D\uDEE3\ufe0f";
        document.getElementById('team1_probability').innerText = /wkt/i.test(String(paceWickets))?paceWickets:paceWickets+' Wkt';
        document.getElementById('team2_probability').innerText = /wkt/i.test(String(spinWickets))?spinWickets:spinWickets+' Wkt';

        // Set the background gradient based on team1 probability
        const team1Probability = parseFloat(pacePercentRaw);
        if (!isNaN(team1Probability) && team1Probability >= 0 && team1Probability <= 100) {
            const divider = document.getElementById('divider');
            divider.style.background = `linear-gradient(to right, #00e5ff ${team1Probability}%, #ffb300 ${team1Probability}%)`;
            if (team1Probability <= 50) {
                document.getElementById('pace_percent').innerHTML = 'HARD <span style="color: #ffd83d;">' + paceLabel + '</span>';
                document.getElementById('spin_percent').innerHTML = 'EASY <span style="color: #ffd83d;">' + (spinPercentRaw??(100-team1Probability)) + '%</span>';
            } else {
                document.getElementById('pace_percent').innerHTML = 'EASY <span style="color: #ffd83d;">' + paceLabel + '</span>';
                document.getElementById('spin_percent').innerHTML = 'HARD <span style="color: #ffd83d;">' + (spinPercentRaw??(100-team1Probability)) + '%</span>';
            }

        } else {
            console.error("Invalid team1 probability value");
        }
    }
}

// Function to check if an image exists and load it
function loadImage(url) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.src = url;
        img.onload = () => resolve(url);
        img.onerror = () => reject();
    });
}

function encodeImageUrl(path) {
    // Ensure the path is properly encoded
    return path.split('/').map(part => encodeURIComponent(part)).join('/');
}

function renderUmpires(data) {
    if(!hasObject(data))return false;
    headerEl.innerHTML = "MATCH UMPIRES";
    document.getElementById('umpire1').textContent = String(data.umpire1 || 'N/A').toUpperCase();
    document.getElementById('umpire2').textContent = String(data.umpire2 || 'N/A').toUpperCase();
    document.getElementById('umpire3').textContent = String(data.umpire3 || 'N/A').toUpperCase();
}
